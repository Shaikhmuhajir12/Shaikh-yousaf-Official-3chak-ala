<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shaikh Yousaf | Official</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#080a0f;
  color:#fff;
  font-family:Cairo,sans-serif;
  overflow-x:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:100;
  min-height:70px;
  padding:12px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(8,10,15,.96);
  border-bottom:1px solid #dcae4d55;
  backdrop-filter:blur(10px);
}

.brand{
  color:#e8bd63;
  font-size:21px;
  font-weight:900;
}

nav{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

nav a{
  font-size:13px;
  transition:.3s;
}

nav a:hover{
  color:#e8bd63;
}

/* LOGO */
.logo{
  position:fixed;
  top:88px;
  right:14px;
  width:90px;
  height:90px;
  z-index:90;
  border-radius:50%;
  padding:4px;
  background:linear-gradient(135deg,#fff0a9,#b77c20,#fff0a9);
  box-shadow:0 0 25px #e8bd6366;
  animation:logoFloat 3s infinite ease-in-out;
}

.logo-in{
  width:100%;
  height:100%;
  border-radius:50%;
  background:#0b0d12;
  border:2px dashed #e8bd63;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.logo-in b{
  color:#e8bd63;
  font-size:23px;
}

.logo-in small{
  font-size:8px;
  letter-spacing:2px;
}

@keyframes logoFloat{
  0%,100%{
    transform:translateY(0) rotate(0);
  }
  50%{
    transform:translateY(-8px) rotate(5deg);
  }
}

/* HERO */
.hero{
  min-height:90vh;
  padding:55px 7%;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:40px;
  background:
  radial-gradient(circle at 20% 50%,#e8bd631b,transparent 35%),
  linear-gradient(135deg,#080a0f,#171209,#080a0f);
}

.hero-text{
  animation:heroText 1.2s ease;
}

.hero-text small{
  color:#e8bd63;
  letter-spacing:3px;
  font-weight:bold;
}

.hero h1{
  font-size:clamp(40px,6vw,70px);
  line-height:1.3;
  margin:15px 0;
}

.hero h1 span{
  color:#e8bd63;
}

.hero p{
  color:#ccc;
  line-height:2;
  max-width:550px;
  margin-bottom:25px;
}

.btn{
  display:inline-block;
  padding:12px 25px;
  border-radius:30px;
  background:linear-gradient(120deg,#ffe29a,#b77c20);
  color:#111;
  font-weight:900;
  transition:.3s;
}

.btn:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 25px #e8bd6344;
}

@keyframes heroText{
  from{
    opacity:0;
    transform:translateX(40px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

/* PHOTO */
.hero-photo{
  display:flex;
  justify-content:center;
  align-items:center;
}

.photo-frame{
  width:min(90%,400px);
  height:470px;
  padding:7px;
  border-radius:210px 210px 30px 30px;
  background:linear-gradient(140deg,#fff0a9,#b77c20,#fff0a9);
  box-shadow:0 0 45px #e8bd6344;
  animation:photoFloat 4s infinite ease-in-out;
}

.photo-frame img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 20%;
  border-radius:203px 203px 24px 24px;
  display:block;
}

@keyframes photoFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-12px);
  }
}

/* SECTIONS */
section{
  padding:75px 7%;
}

.title{
  text-align:center;
  margin-bottom:35px;
}

.title h2{
  font-size:36px;
}

.title h2 span{
  color:#e8bd63;
}

.title p{
  color:#aaa;
  margin-top:7px;
}

/* VIDEO */
.video-section{
  background:linear-gradient(180deg,#080a0f,#11100c,#080a0f);
}

.video-box{
  max-width:900px;
  margin:auto;
  padding:7px;
  border-radius:25px;
  background:linear-gradient(135deg,#fff0a9,#b77c20,#fff0a9);
  box-shadow:0 0 35px #e8bd6355;
  animation:videoGlow 3s infinite alternate;
}

.video-box video{
  width:100%;
  max-height:600px;
  display:block;
  border-radius:19px;
  background:#000;
}

.video-title{
  text-align:center;
  color:#e8bd63;
  font-size:22px;
  font-weight:900;
  margin:20px 0 12px;
}

@keyframes videoGlow{
  from{
    box-shadow:0 0 15px #e8bd6322;
  }
  to{
    box-shadow:0 0 40px #e8bd6377;
  }
}

/* ABOUT */
.about{
  max-width:900px;
  margin:auto;
  padding:30px;
  text-align:center;
  line-height:2.2;
  color:#ddd;
  background:#141720;
  border:1px solid #e8bd6333;
  border-radius:22px;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.card{
  background:#141720;
  padding:12px;
  border-radius:20px;
  border:1px solid #e8bd6333;
  text-align:center;
  transition:.4s;
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 15px 35px #e8bd6322;
}

.card img{
  width:100%;
  height:290px;

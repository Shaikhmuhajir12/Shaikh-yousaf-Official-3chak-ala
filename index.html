<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="description" content="Shaikh Yousaf Official — story, family, videos, memories and Urdu lyrics">
<title>Shaikh Yousaf | Official</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#080808;
 --panel:#151515;
 --gold:#d9b45b;
 --gold2:#ffe8ad;
 --text:#fff8ec;
 --muted:#c0b6a4;
 --line:#d9b45b42;
}

*{box-sizing:border-box}

html{
 scroll-behavior:smooth;
 scroll-padding-top:85px;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Cairo,sans-serif;
 line-height:1.9;
 overflow-x:hidden;
}

body.light{
 --bg:#f5efe3;
 --panel:#fffaf0;
 --text:#211b12;
 --muted:#655b4a;
 --line:#a27a3245;
}

a{
 color:inherit;
 text-decoration:none;
}

button,input,textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

img,video{
 max-width:100%;
}

.gold{
 color:var(--gold);
}

.container{
 width:min(1150px,92%);
 margin:auto;
}

.section{
 padding:68px 0;
 scroll-margin-top:80px;
}

.section-title{
 text-align:center;
 margin-bottom:30px;
}

.section-title h2{
 font-size:clamp(26px,4vw,40px);
 color:var(--gold);
 margin:0;
}

.section-title p{
 color:var(--muted);
}

.btn{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:7px;
 padding:11px 21px;
 border:1px solid var(--gold);
 border-radius:28px;
 background:linear-gradient(135deg,#ffe8ad,#d9b45b);
 color:#171108;
 font-weight:800;
}

.btn-outline{
 background:transparent;
 color:var(--gold);
}

.panel,
.card,
.game-box{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:18px;
 overflow:hidden;
}

.panel{
 padding:clamp(18px,4vw,30px);
}

.cards{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));
 gap:20px;
}

.card img{
 width:100%;
 height:270px;
 object-fit:contain;
 background:#050505;
 display:block;
}

.card-body{
 padding:17px;
}

.card h3{
 color:var(--gold);
 margin:0 0 7px;
}

.muted{
 color:var(--muted);
}

.field{
 width:100%;
 padding:12px;
 border:1px solid var(--line);
 border-radius:10px;
 background:var(--panel);
 color:var(--text);
}

.form{
 display:grid;
 gap:12px;
}

/* ================= WELCOME ================= */

#welcome{
 position:fixed;
 inset:0;
 z-index:99999;
 display:grid;
 place-items:center;
 padding:20px;
 text-align:center;
 overflow:hidden;
 background:
 radial-gradient(ellipse at 50% 35%,#60431980,transparent 50%),
 #050505;
 transition:opacity .8s,visibility .8s;
}

#welcome.hide{
 opacity:0;
 visibility:hidden;
 pointer-events:none;
}

.welcome-box{
 max-width:650px;
 animation:welcomeIn 1.1s ease both;
}

#welcome h1{
 font-size:clamp(30px,7vw,53px);
 color:var(--gold2);
 margin:8px 0;
}

#welcome .urdu{
 font-family:Amiri,serif;
 font-size:clamp(25px,5vw,39px);
 color:var(--gold);
}

#welcome .credit{
 font-size:13px;
 color:#fff0c7;
 direction:ltr;
}

#welcome .welcome-logo{
 width:130px;
 height:130px;
 object-fit:contain;
 display:block;
 margin:0 auto 12px;
 filter:drop-shadow(0 0 20px #d9b45b65);
 animation:logoGlow 3s infinite;
}

#welcome .small-line{
 color:#c9bda7;
}

.welcome-decoration{
 width:100px;
 height:2px;
 background:linear-gradient(
  90deg,
  transparent,
  var(--gold),
  transparent
 );
 margin:16px auto;
}

@keyframes welcomeIn{
 from{
  opacity:0;
  transform:translateY(22px) scale(.96);
 }
 to{
  opacity:1;
  transform:none;
 }
}

@keyframes logoGlow{
 50%{
  filter:drop-shadow(0 0 28px #d9b45bba);
 }
}

@keyframes floatUp{
 50%{
  transform:translateY(-6px);
 }
}

/* ================= HEADER ================= */

header{
 position:sticky;
 top:0;
 z-index:1000;
 background:#080808ed;
 backdrop-filter:blur(14px);
 border-bottom:1px solid var(--line);
}

body.light header{
 background:#fffaf0ed;
}

.nav{
 width:min(1300px,94%);
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:13px;
 flex-wrap:wrap;
 padding:10px 0;
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
 color:var(--gold);
 font-weight:800;
}

#navLogo{
 width:49px;
 height:49px;
 object-fit:contain;
 border:0;
 border-radius:0;
}

.nav-links{
 display:flex;
 align-items:center;
 gap:14px;
 flex-wrap:wrap;
 font-size:12px;
}

.nav-links a:hover{
 color:var(--gold);
}

#themeToggle{
 width:40px;
 height:40px;
 border-radius:50%;
 background:var(--panel);
 border:1px solid var(--line);
 color:var(--gold);
}

/* ================= HERO ================= */

.hero{
 position:relative;
 min-height:77vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:50px 4%;
 background:
 linear-gradient(#050505cf,#050505e8),
 url('./yousaf-8.jpg') center/cover no-repeat;
}

.hero-inner{
 width:min(1000px,100%);
 display:grid;
 grid-template-columns:145px 1fr;
 gap:25px;
 align-items:center;
 text-align:right;
}

.hero-side-logo{
 width:140px;
 height:140px;
 object-fit:contain;
 justify-self:center;
 filter:drop-shadow(0 0 22px #d9b45b55);
}

.hero-copy h1{
 font-size:clamp(30px,6vw,60px);
 line-height:1.4;
 margin:0;
 color:#fff;
}

.hero-copy p{
 color:#e5d8c1;
}

.hero-buttons{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:20px;
}

.hero-kicker{
 letter-spacing:2px;
 color:var(--gold2);
 font-size:12px;
 direction:ltr;
 text-align:right;
}

/* ================= PROFILES ================= */

.profile-row{
 display:grid;
 grid-template-columns:minmax(200px,320px) 1fr;
 gap:24px;
 align-items:center;
 margin:20px 0;
}

.profile-photo{
 width:100%;
 height:350px;
 object-fit:contain;
 object-position:center;
 background:#050505;
 border:1px solid var(--line);
 border-radius:16px;
 display:block;
}

.profile-details{
 padding:23px;
}

.profile-details h3{
 font-size:25px;
 color:var(--gold);
 margin:0;
}

.profile-details p{
 color:var(--muted);
}

.detail-list{
 padding-right:20px;
 color:var(--muted);
}

.detail-list li{
 margin:5px 0;
}

.story-text{
 color:var(--muted);
 white-space:normal;
}

.story-text p{
 margin:0 0 14px;
}

.story-highlight{
 border-right:3px solid var(--gold);
 padding-right:15px;
 color:var(--gold2);
}

/* ================= VIDEOS ================= */

.video-grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(min(100%,300px),1fr));
 gap:20px;
}

.video-card{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:17px;
 overflow:hidden;
}

.video-card video{
 display:block;
 width:100%;
 height:min(78svh,760px);
 object-fit:contain;
 background:#000;
}

.video-caption{
 padding:13px 16px;
}

.video-caption h3{
 color:var(--gold);
 margin:0;
}

.video-caption p{
 color:var(--muted);
 margin:0;
}

/* ================= REELS ================= */

.reels-container{
 width:min(100%,510px);
 height:78svh;
 min-height:390px;
 margin:auto;
 overflow-y:auto;
 overscroll-behavior-y:contain;
 scroll-snap-type:y mandatory;
 scrollbar-color:var(--gold) #111;
 border-radius:18px;
}

.reel{
 height:100%;
 min-height:100%;
 position:relative;
 overflow:hidden;
 scroll-snap-align:start;
 scroll-snap-stop:always;
 border:1px solid var(--line);
 border-radius:18px;
 background:#000;
}

.reel video{
 display:block;
 width:100%;
 height:100%;
 object-fit:contain;
 background:#000;
}

.reel-shade{
 position:absolute;
 inset:0;
 pointer-events:none;
 background:
 linear-gradient(
  0deg,
  #000d,
  transparent 43%,
  #0002
 );
}

.reel-label{
 position:absolute;
 bottom:17px;
 right:14px;
 left:78px;
 z-index:2;
 color:white;
}

.reel-label p{
 font-size:12px;
 margin:0;
}

.reel-actions{
 position:absolute;
 bottom:18px;
 left:9px;
 z-index:3;
 display:flex;
 flex-direction:column;
 gap:11px;
}

.reel-action{
 width:49px;
 min-height:47px;
 border:1px solid #ffffff4d;
 border-radius:26px;
 background:#111c;
 color:#fff;
 font-size:20px;
}

.reel-action small{
 display:block;
 font-size:10px;
}

.reel-action.liked{
 color:#ff5577;
}

/* ================= GALLERY ================= */

.gallery-grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(170px,1fr));
 gap:12px;
}

.gallery-grid img{
 width:100%;
 height:260px;
 object-fit:contain;
 background:#050505;
 border:1px solid var(--line);
 border-radius:12px;
 cursor:pointer;
}

/* ================= QUOTES ================= */

.quote{
 background:var(--panel);
 border-right:4px solid var(--gold);
 border-radius:10px;
 padding:18px;
 margin:13px 0;
 font-family:Amiri,serif;
 font-size:22px;
 color:var(--muted);
}

.socials{
 display:flex;
 gap:10px;
 justify-content:center;
 flex-wrap:wrap;
}

.social-link{
 border:1px solid var(--line);
 border-radius:22px;
 padding:8px 14px;
 color:var(--gold);
 background:transparent;
}

.social-link:hover{
 background:var(--gold);
 color:#111;
}

/* ================= COMMENTS ================= */

.comment-list{
 display:grid;
 gap:12px;
 margin-top:20px;
}

.comment-item{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:12px;
 padding:13px;
 overflow-wrap:anywhere;
}

.comment-item strong{
 color:var(--gold);
}

.comment-item p{
 white-space:pre-wrap;
 margin:5px 0;
}

/* ================= GAMES ================= */

.game-box{
 padding:19px;
}

.game-box h3{
 color:var(--gold);
}

.game-row{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}

.game-row input{
 flex:1;
 min-width:90px;
}

#ticBoard{
 display:grid;
 grid-template-columns:repeat(3,64px);
 gap:6px;
 justify-content:center;
 margin:15px auto;
}

#ticBoard button{
 height:64px;
 background:var(--bg);
 color:var(--gold);
 border:1px solid var(--gold);
 border-radius:10px;
 font-size:26px;
}

#gameMessage,
#guessMessage,
#mathMessage,
#rpsMessage{
 color:var(--gold);
}

/* ================= FLOATING ================= */

#floatingTools{
 position:fixed;
 left:12px;
 bottom:13px;
 z-index:5000;
 display:flex;
 flex-direction:column;
 align-items:flex-start;
 gap:8px;
}

.float-btn{
 width:45px;
 height:45px;
 display:grid;
 place-items:center;
 border:1px solid var(--gold);
 border-radius:50%;
 background:#101010;
 color:var(--gold);
 font-size:21px;
 box-shadow:0 4px 16px #0008;
}

#topFloat{
 animation:floatUp 1.7s infinite;
}

#musicPanel,
#sharePopup{
 display:none;
 width:min(330px,88vw);
 padding:13px;
 border:1px solid var(--gold);
 border-radius:15px;
 background:#101010;
 color:white;
 box-shadow:0 8px 30px #000a;
}

#musicPanel.open,
#sharePopup.open{
 display:block;
}

.panel-title{
 color:var(--gold);
 font-weight:800;
 margin-bottom:8px;
}

.music-buttons,
.share-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;
}

.music-buttons button,
.share-grid button,
.share-grid a{
 border:1px solid #66532b;
 border-radius:8px;
 background:#211c12;
 color:#ffe8ad;
 text-align:center;
 padding:8px 2px;
 font-size:12px;
}

#lyricsBox{
 margin-top:10px;
 padding:10px;
 border-radius:12px;
 background:
 radial-gradient(
  circle at center,
  #3a2a10 0%,
  #211c12 45%,
  #100e0a 100%
 );
 border:1px solid #d9b45b55;
 max-height:310px;
 overflow-y:auto;
 scroll-behavior:smooth;
 direction:rtl;
}

#karaokeLyrics{
 display:flex;
 flex-direction:column;
 gap:8px;
}

.lyric-line{
 padding:9px 10px;
 border-radius:9px;
 color:#bcb19d;
 font-family:Amiri,serif;
 font-size:16px;
 line-height:1.8;
 text-align:center;
 opacity:.55;
 transform:scale(.97);
 transition:.35s ease;
}

.lyric-line.active{
 color:#ffe8ad;
 background:
 linear-gradient(
  90deg,
  transparent,
  #d9b45b25,
  transparent
 );
 border:1px solid #d9b45b55;
 opacity:1;
 transform:scale(1.04);
 text-shadow:0 0 10px #d9b45b88;
 font-size:20px;
 font-weight:700;
}

.lyric-line.passed{
 opacity:.7;
 color:#d9b45b;
}

.lyrics-progress{
 height:4px;
 background:#ffffff12;
 border-radius:10px;
 overflow:hidden;
 margin-top:10px;
}

#lyricsProgressBar{
 width:0%;
 height:100%;
 background:
 linear-gradient(
  90deg,
  #d9b45b,
  #ffe8ad
 );
 transition:width .15s linear;
}

#musicSeek{
 width:100%;
 accent-color:#d9b45b;
 margin-top:10px;
}

#musicTime{
 display:flex;
 justify-content:space-between;
 direction:ltr;
 color:#c6bda9;
 font-size:11px;
}

#currentLyricTitle{
 color:#ffe8ad;
 font-family:Amiri,serif;
 text-align:center;
 font-size:19px;
 margin:8px 0;
 min-height:35px;
}

#lyricsStatus{
 color:#c6bda9;
 font-size:11px;
 text-align:center;
}

#toast{
 display:none;
 position:fixed;
 left:50%;
 bottom:20px;
 transform:translateX(-50%);
 z-index:100000;
 background:var(--gold);
 color:#111;
 border-radius:25px;
 padding:9px 16px;
 max-width:90%;
 text-align:center;
}

#lightbox{
 display:none;
 position:fixed;
 inset:0;
 z-index:9000;
 background:#000e;
 align-items:center;
 justify-content:center;
 padding:15px;
}

#lightbox img{
 max-width:95vw;
 max-height:90vh;
 object-fit:

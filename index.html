<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shaikh Yousaf | Official</title>

<meta name="description"
content="Shaikh Yousaf — A story of simplicity, struggle, family, dedication and dreams.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Cairo',sans-serif;
    background:#050505;
    color:#fff;
    overflow-x:hidden;
}

/* BACKGROUND */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 20% 20%,rgba(212,175,55,.14),transparent 30%),
    radial-gradient(circle at 80% 70%,rgba(212,175,55,.10),transparent 30%);
    pointer-events:none;
    z-index:-1;
}

/* TOP LOGO */
.logo-circle{
    position:fixed;
    top:18px;
    right:18px;
    width:88px;
    height:88px;
    border:3px solid #d4af37;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    background:#080808;
    box-shadow:0 0 20px rgba(212,175,55,.6);
    animation:logoSpin 10s linear infinite;
}

.logo-circle span{
    color:#d4af37;
    font-size:13px;
    font-weight:800;
    text-align:center;
    line-height:1.2;
}

@keyframes logoSpin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* HERO */
.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 20px 50px;
    position:relative;
}

.hero-content{
    max-width:900px;
    animation:fadeUp 1.4s ease;
}

.hero-image{
    width:270px;
    height:270px;
    object-fit:cover;
    border-radius:50%;
    border:5px solid #d4af37;
    padding:6px;
    background:#111;
    box-shadow:
    0 0 25px rgba(212,175,55,.5),
    0 0 70px rgba(212,175,55,.15);
    animation:photoFloat 4s ease-in-out infinite;
}

.hero h1{
    margin-top:28px;
    font-family:'Playfair Display',serif;
    font-size:clamp(38px,7vw,76px);
    color:#d4af37;
    letter-spacing:2px;
}

.hero h2{
    font-size:clamp(18px,3vw,28px);
    margin-top:8px;
    color:#eee;
}

.hero p{
    margin:20px auto;
    max-width:700px;
    color:#bbb;
    font-size:17px;
    line-height:2;
}

.btn{
    display:inline-block;
    margin:10px;
    padding:13px 28px;
    border-radius:30px;
    text-decoration:none;
    color:#050505;
    background:#d4af37;
    font-weight:800;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-5px) scale(1.03);
    box-shadow:0 10px 30px rgba(212,175,55,.3);
}

/* SECTIONS */
section{
    padding:80px 20px;
    max-width:1100px;
    margin:auto;
}

.section-title{
    text-align:center;
    color:#d4af37;
    font-family:'Playfair Display',serif;
    font-size:42px;
    margin-bottom:40px;
}

/* STORY */
.story{
    text-align:center;
    color:#ccc;
    line-height:2.2;
    font-size:18px;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:linear-gradient(145deg,#151515,#090909);
    border:1px solid rgba(212,175,55,.35);
    border-radius:22px;
    padding:30px 22px;
    text-align:center;
    transition:.4s;
    animation:fadeUp 1s ease;
}

.card:hover{
    transform:translateY(-10px);
    border-color:#d4af37;
    box-shadow:0 15px 40px rgba(212,175,55,.15);
}

.card i{
    font-size:40px;
    color:#d4af37;
    margin-bottom:20px;
}

.card h3{
    color:#fff;
    margin-bottom:12px;
}

.card p{
    color:#aaa;
    line-height:1.9;
}

/* GALLERY */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:25px;
}

.gallery img{
    width:100%;
    height:330px;
    object-fit:cover;
    border-radius:20px;
    border:2px solid rgba(212,175,55,.4);
    transition:.5s;
    animation:imageFloat 5s ease-in-out infinite;
}

.gallery img:hover{
    transform:scale(1.04);
    border-color:#d4af37;
    box-shadow:0 15px 40px rgba(212,175,55,.25);
}

/* VIDEOS */
.video-section{
    text-align:center;
}

.video-box{
    margin:25px auto 45px;
    max-width:850px;
    padding:8px;
    border-radius:24px;
    background:linear-gradient(135deg,#d4af37,#171717,#d4af37);
    box-shadow:0 0 35px rgba(212,175,55,.2);
    animation:videoGlow 3s ease-in-out infinite;
}

.video-box video{
    display:block;
    width:100%;
    max-height:600px;
    border-radius:18px;
    background:#000;
}

/* SOCIAL */
.social{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
}

.social a{
    width:52px;
    height:52px;
    border:1px solid #d4af37;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d4af37;
    font-size:21px;
    text-decoration:none;
    transition:.3s;
}

.social a:hover{
    background:#d4af37;
    color:#050505;
    transform:translateY(-7px) rotate(8deg);
}

/* FOOTER */
footer{
    border-top:1px solid rgba(212,175,55,.25);
    text-align:center;
    padding:35px 20px;
    color:#888;
}

footer strong{
    color:#d4af37;
}

/* ANIMATIONS */
@keyframes photoFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

@keyframes imageFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(35px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes videoGlow{
    0%,100%{
        box-shadow:0 0 20px rgba(212,175,55,.15);
    }
    50%{
        box-shadow:0 0 45px rgba(212,175,55,.35);
    }
}

/* MOBILE */
@media(max-width:600px){

    .logo-circle{
        width:68px;
        height:68px;
        top:10px;
        right:10px;
    }

    .logo-circle span{
        font-size:10px;
    }

    .hero-image{
        width:210px;
        height:210px;
    }

    .hero{
        padding-top:100px;
    }

    section{
        padding:60px 15px;
    }

    .section-title{
        font-size:32px;
    }

    .gallery img{
        height:300px;
    }
}

</style>
</head>

<body>

<!-- MUHAJIR LOGO -->
<div class="logo-circle">
    <span>MUHAJIR<br>SHAIKH</span>
</div>


<!-- HERO -->
<header class="hero">

    <div class="hero-content">

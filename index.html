<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Shaikh Yousaf | Official</title>

<meta name="theme-color" content="#080808">
<meta name="description" content="Shaikh Yousaf Official — story, family, videos, memories and lyrics">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#070707;
 --panel:#121212;
 --panel2:#18140d;
 --gold:#d9b45b;
 --gold2:#ffe8ad;
 --text:#fff8ec;
 --muted:#c0b6a4;
 --line:#d9b45b42;
 --glow:#d9b45b55;
}

*{box-sizing:border-box}

html{
 scroll-behavior:smooth;
 scroll-padding-top:85px;
}

body{
 margin:0;
 background:
 radial-gradient(circle at top,#21190b 0,#070707 30%,#050505 100%);
 color:var(--text);
 font-family:"Noto Naskh Arabic",Cairo,sans-serif;
 line-height:2;
 overflow-x:hidden;
}

body.light{
 --bg:#f5efe3;
 --panel:#fffaf0;
 --panel2:#f4ead4;
 --text:#211b12;
 --muted:#655b4a;
 --line:#a27a3245;
}

a{
 color:inherit;
 text-decoration:none;
}

button,input,textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

img,video{
 max-width:100%;
}

.gold{
 color:var(--gold);
}

.container{
 width:min(1150px,92%);
 margin:auto;
}

.section{
 padding:75px 0;
 scroll-margin-top:80px;
}

.section-title{
 text-align:center;
 margin-bottom:32px;
}

.section-title h2{
 font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;
 font-size:clamp(27px,5vw,43px);
 color:var(--gold);
 margin:0 0 5px;
 line-height:1.8;
}

.section-title p{
 color:var(--muted);
 margin:0;
}

.btn{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:7px;
 padding:10px 21px;
 border:1px solid var(--gold);
 border-radius:28px;
 background:linear-gradient(135deg,#ffe8ad,#d9b45b);
 color:#171108;
 font-weight:800;
}

.btn-outline{
 background:transparent;
 color:var(--gold);
}

.panel,
.card,
.game-box{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:18px;
 overflow:hidden;
}

.panel{
 padding:clamp(18px,4vw,30px);
}

.cards{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));
 gap:20px;
}

.card img{
 width:100%;
 height:270px;
 object-fit:contain;
 background:#050505;
 display:block;
}

.card-body{
 padding:17px;
}

.card h3{
 color:var(--gold);
 margin:0 0 7px;
}

.muted{
 color:var(--muted);
}

.field{
 width:100%;
 padding:12px;
 border:1px solid var(--line);
 border-radius:10px;
 background:var(--panel);
 color:var(--text);
}

.form{
 display:grid;
 gap:12px;
}

/* WELCOME */

#welcome{
 position:fixed;
 inset:0;
 z-index:99999;
 display:grid;
 place-items:center;
 padding:20px;
 text-align:center;
 overflow:hidden;
 background:
 radial-gradient(ellipse at 50% 35%,#60431980,transparent 50%),
 #050505;
 transition:opacity .8s,visibility .8s;
}

#welcome.hide{
 opacity:0;
 visibility:hidden;
 pointer-events:none;
}

.welcome-box{
 max-width:680px;
 animation:welcomeIn 1.1s ease both;
}

#welcome h1{
 font-family:Cairo,sans-serif;
 font-size:clamp(30px,7vw,53px);
 color:var(--gold2);
 margin:8px 0;
}

#welcome .urdu{
 font-family:"Noto Nastaliq Urdu",serif;
 font-size:clamp(25px,5vw,39px);
 color:var(--gold);
}

#welcome .credit{
 font-size:13px;
 color:#fff0c7;
 direction:ltr;
}

#welcome .welcome-logo{
 width:130px;
 height:130px;
 object-fit:contain;
 display:block;
 margin:0 auto 12px;
 filter:drop-shadow(0 0 20px #d9b45b65);
 animation:logoGlow 3s infinite;
}

#welcome .small-line{
 color:#c9bda7;
}

#welcome-decoration{
 width:100px;
 height:2px;
 background:linear-gradient(90deg,transparent,var(--gold),transparent);
 margin:16px auto;
}

@keyframes welcomeIn{
 from{
  opacity:0;
  transform:translateY(22px) scale(.96)
 }
 to{
  opacity:1;
  transform:none
 }
}

@keyframes logoGlow{
 50%{
  filter:drop-shadow(0 0 28px #d9b45bba)
 }
}

/* HEADER */

header{
 position:sticky;
 top:0;
 z-index:1000;
 background:#080808ed;
 backdrop-filter:blur(14px);
 border-bottom:1px solid var(--line);
}

body.light header{
 background:#fffaf0ed;
}

.nav{
 width:min(1300px,94%);
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:13px;
 flex-wrap:wrap;
 padding:10px 0;
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
 color:var(--gold);
 font-weight:800;
}

#navLogo{
 width:49px;
 height:49px;
 object-fit:contain;
 border:0;
 border-radius:0;
}

.nav-links{
 display:flex;
 align-items:center;
 gap:13px;
 flex-wrap:wrap;
 font-size:12px;
}

.nav-links a:hover{
 color:var(--gold);
}

#themeToggle{
 width:40px;
 height:40px;
 border-radius:50%;
 background:var(--panel);
 border:1px solid var(--line);
 color:var(--gold);
}

/* HERO */

.hero{
 position:relative;
 min-height:77vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:50px 4%;
 background:
 linear-gradient(#050505cf,#050505e8),
 url('./yousaf-8.jpg') center/cover no-repeat;
}

.hero-inner{
 width:min(1000px,100%);
 display:grid;
 grid-template-columns:145px 1fr;
 gap:25px;
 align-items:center;
 text-align:right;
}

.hero-side-logo{
 width:140px;
 height:140px;
 object-fit:contain;
 justify-self:center;
 filter:drop-shadow(0 0 22px #d9b45b55);
}

.hero-copy h1{
 font-family:"Noto Nastaliq Urdu",serif;
 font-size:clamp(30px,6vw,60px);
 line-height:1.7;
 margin:0;
 color:#fff;
}

.hero-copy p{
 color:#e5d8c1;
}

.hero-buttons{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:20px;
}

.hero-kicker{
 letter-spacing:2px;
 color:var(--gold2);
 font-size:12px;
 direction:ltr;
 text-align:right;
}

/* PROFILE */

.profile-row{
 display:grid;
 grid-template-columns:minmax(200px,320px) 1fr;
 gap:24px;
 align-items:center;
 margin:20px 0;
}

.profile-photo{
 width:100%;
 height:350px;
 object-fit:contain;
 object-position:center;
 background:#050505;
 border:1px solid var(--line);
 border-radius:16px;
 display:block;
}

.profile-details{
 padding:23px;
}

.profile-details h3{
 font-size:25px;
 color:var(--gold);
 margin:0;
}

.profile-details p{
 color:var(--muted);
}

.detail-list{
 padding-right:20px;
 color:var(--muted);
}

.detail-list li{
 margin:5px 0;
}

.story-text{
 color:var(--muted);
}

.story-text p{
 margin:0 0 14px;
}

.story-highlight{
 border-right:3px solid var(--gold);
 padding-right:15px;
 color:var(--gold2);
}

/* VIDEOS */

.video-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));
 gap:20px;
}

.video-card{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:17px;
 overflow:hidden;
}

.video-card video{
 display:block;
 width:100%;
 height:min(78svh,760px);
 object-fit:contain;
 background:#000;
}

.video-caption{
 padding:13px 16px;
}

.video-caption h3{
 color:var(--gold);
 margin:0;
}

.video-caption p{
 color:var(--muted);
 margin:0;
}

/* =========================
   LYRICS MAIN PLAYER
========================= */

.lyrics-section{
 position:relative;
 overflow:hidden;
}

.lyrics-section:before{
 content:"";
 position:absolute;
 width:450px;
 height:450px;
 border-radius:50%;
 background:#d9b45b08;
 filter:blur(40px);
 top:-180px;
 right:-180px;
 pointer-events:none;
}

.lyrics-player{
 position:relative;
 max-width:900px;
 margin:auto;
 padding:20px;
 background:
 linear-gradient(145deg,#17130c,#0d0d0d);
 border:1px solid #d9b45b55;
 border-radius:25px;
 box-shadow:
 0 20px 70px #0009,
 inset 0 0 50px #d9b45b08;
}

body.light .lyrics-player{
 background:linear-gradient(145deg,#fff9ed,#f0e4ce);
}

.lyrics-top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 flex-wrap:wrap;
 margin-bottom:15px;
}

.lyrics-badge{
 display:inline-flex;
 align-items:center;
 gap:8px;
 color:var(--gold2);
 background:#d9b45b12;
 border:1px solid #d9b45b35;
 padding:6px 13px;
 border-radius:20px;
 font-size:12px;
}

.lyrics-song-name{
 font-family:"Noto Nastaliq Urdu",serif;
 font-size:23px;
 color:var(--gold);
}

.lyrics-current{
 min-height:145px;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:25px 15px;
 margin-bottom:18px;
 border:1px solid #d9b45b30;
 border-radius:20px;
 background:
 radial-gradient(circle,#d9b45b12,transparent 65%),
 #0d0d0d;
 box-shadow:inset 0 0 35px #0008;
}

body.light .lyrics-current{
 background:#f8efde;
}

#currentLyric{
 font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;
 font-size:clamp(24px,5vw,39px);
 font-weight:700;
 line-height:2.1;
 color:var(--gold2);
 text-shadow:0 0 22px #d9b45b55;
 transition:.3s;
}

.lyrics-progress-wrap{
 margin:12px 0 8px;
}

#lyricsProgress{
 width:100%;
 height:7px;
 appearance:none;
 border-radius:20px;
 background:#332a1c;
 cursor:pointer;
}

#lyricsProgress::-webkit-slider-thumb{
 appearance:none;
 width:17px;
 height:17px;
 border-radius:50%;
 background:var(--gold);
 box-shadow:0 0 12px #d9b45b99;
}

#lyricsProgress::-moz-range-thumb{
 width:17px;
 height:17px;
 border:0;
 border-radius:50%;
 background:var(--gold);
}

.lyrics-time{
 display:flex;
 justify-content:space-between;
 direction:ltr;
 color:var(--muted);
 font-size:12px;
}

.lyrics-controls{
 display:flex;
 justify-content:center;
 align-items:center;
 flex-wrap:wrap;
 gap:9px;
 margin:17px 0;
}

.lyrics-control{
 min-width:48px;
 height:44px;
 padding:0 13px;
 border:1px solid #d9b45b55;
 border-radius:25px;
 background:#17130d;
 color:var(--gold2);
}

.lyrics-control:hover{
 background:#2a2114;
 box-shadow:0 0 18px #d9b45b22;
}

.lyrics-control.main{
 width:62px;
 height:52px;
 font-size:22px;
 background:linear-gradient(135deg,#ffe8ad,#d9b45b);
 color:#171108;
}

.lyrics-options{
 display:flex;
 justify-content:center;
 gap:10px;
 flex-wrap:wrap;
 margin-bottom:15px;
}

.lyrics-options button{
 border:1px solid #d9b45b35;
 background:#17130d;
 color:var(--muted);
 padding:7px 13px;
 border-radius:20px;
 font-size:12px;
}

.lyrics-options button.active{
 color:#171108;
 background:var(--gold);
}

.lyrics-status{
 text-align:center;
 color:var(--muted);
 font-size:12px;
 margin:10px 0;
}

.lyrics-list{
 height:440px;
 overflow-y:auto;
 padding:15px 12px;
 border:1px solid #d9b45b25;
 border-radius:18px;
 background:#090909;
 scroll-behavior:smooth;
}

body.light .lyrics-list{
 background:#f3eadb;
}

.lyric-line{
 position:relative;
 padding:13px 16px;
 margin:5px 0;
 border-radius:12px;
 color:#a99f8d;
 text-align:center;
 font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;
 font-size:18px;
 line-height:2.1;
 transition:.35s;
 cursor:pointer;
}

.lyric-line:hover{
 background:#d9b45b0d;
 color:#dfd2bb;
}

.lyric-line.active{
 color:var(--gold2);
 background:
 linear-gradient(90deg,transparent,#d9b45b18,transparent);
 transform:scale(1.02);
 text-shadow:0 0 15px #d9b45b55;
 font-size:22px;
 font-weight:700;
}

.lyric-line.active:before{
 content:"♪";
 position:absolute;
 right:8px;
 color:var(--gold);
}

.lyrics-note{
 text-align:center;
 margin-top:15px;
 color:#938876;
 font-size:11px;
}

/* REELS */

.reels-container{
 width:min(100%,510px);
 height:78svh;
 min-height:390px;
 margin:auto;
 overflow-y:auto;
 overscroll-behavior-y:contain;
 scroll-snap-type:y mandatory;
 scrollbar-color:var(--gold) #111;
 border-radius:18px;
}

.reel{
 height:100%;
 min-height:100%;
 position:relative;
 overflow:hidden;
 scroll-snap-align:start;
 scroll-snap-stop:always;
 border:1px solid var(--line);
 border-radius:18px;
 background:#000;
}

.reel video{
 display:block;
 width:100%;
 height:100%;
 object-fit:contain;
 background:#000;
}

.reel-shade{
 position:absolute;
 inset:0;
 pointer-events:none;
 background:linear-gradient(0deg,#000d,transparent 43%,#0002);
}

.reel-label{
 position:absolute;
 bottom:17px;
 right:14px;
 left:78px;
 z-index:2;
 color:white;
}

.reel-label p{
 font-size:12px;
 margin:0;
}

.reel-actions{
 position:absolute;
 bottom:18px;
 left:9px;
 z-index:3;
 display:flex;
 flex-direction:column;
 gap:11px;
}

.reel-action{
 width:49px;
 min-height:47px;
 border:1px solid #ffffff4d;
 border-radius:26px;
 background:#111c;
 color:#fff;
 font-size:20px;
}

.reel-action small{
 display:block;
 font-size:10px;
}

.reel-action.liked{
 color:#ff5577;
}

/* GALLERY */

.gallery-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
 gap:12px;
}

.gallery-grid img{
 width:100%;
 height:260px;
 object-fit:contain;
 background:#050505;
 border:1px solid var(--line);
 border-radius:12px;
 cursor:pointer;
}

/* QUOTES */

.quote{
 background:var(--panel);
 border-right:4px solid var(--gold);
 border-radius:10px;
 padding:18px;
 margin:13px 0;
 font-family:"Noto Nastaliq Urdu",serif;
 font-size:22px;
 color:var(--muted);
}

/* SOCIAL */

.socials{
 display:flex;
 gap:10px;
 justify-content:center;
 flex-wrap:wrap;
}

.social-link{
 border:1px solid var(--line);
 border-radius:22px;
 padding:8px 14px;
 color:var(--gold);
 background:transparent;
}

.social-link:hover{
 background:var(--gold);
 color:#111;
}

/* COMMENTS */

.comment-list{
 display:grid;
 gap:12px;
 margin-top:20px;
}

.comment-item{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:12px;
 padding:13px;
 overflow-wrap:anywhere;
}

.comment-item strong{
 color:var(--gold);
}

.comment-item p{
 white-space:pre-wrap;
 margin:5px 0;
}

/* GAMES */

.game-box{
 padding:19px;
}

.game-box h3{
 color:var(--gold);
}

.game-row{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}

.game-row input{
 flex:1;
 min-width:90px;
}

#ticBoard{
 display:grid;
 grid-template-columns:repeat(3,64px);
 gap:6px;
 justify-content:center;
 margin:15px auto;
}

#ticBoard button{
 height:64px;
 background:var(--bg);
 color:var(--gold);
 border:1px solid var(--gold);
 border-radius:10px;
 font-size:26px;
}

#gameMessage,
#guessMessage,
#mathMessage,
#rpsMessage{
 color:var(--gold);
}

/* FLOATING */

#floatingTools{
 position:fixed;
 left:12px;
 bottom:13px;
 z-index:5000;
 display:flex;
 flex-direction:column;
 align-items:flex-start;
 gap:8px;
}

.float-btn{
 width:45px;
 height:45px;
 display:grid;
 place-items:center;
 border:1px solid var(--gold);
 border-radius:50%;
 background:#101010;
 color:var(--gold);
 font-size:21px;
 box-shadow:0 4px 16px #0008;
}

#musicPanel,
#sharePopup{
 display:none;
 width:min(310px,86vw);
 padding:13px;
 border:1px solid var(--gold);
 border-radius:15px;
 background:#101010;
 color:white;
 box-shadow:0 8px 30px #000a;
}

#musicPanel.open,
#sharePopup.open{
 display:block;
}

.panel-title{
 color:var(--gold);
 font-weight:800;
 margin-bottom:8px;
}

.music-buttons,
.share-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;
}

.music-buttons button,
.share-grid button,
.share-grid a{
 border:1px solid #66532b;
 border-radius:8px;
 background:#211c12;
 color:#ffe8ad;
 text-align:center;
 padding:8px 2px;
 font-size:12px;
}

#miniLyrics{
 margin-top:9px;
 padding:10px;
 border-radius:9px;
 background:#211c12;
 color:#ffe8ad;
 font-family:"Noto Nastaliq Urdu",serif;
 font-size:15px;
 line-height:2;
 text-align:center;
 min-height:50px;
}

#lyricsStatus{
 color:#c6bda9;
 font-size:11px;
}

#toast{
 display:none;
 position:fixed;
 left:50%;
 bottom:20px;
 transform:translateX(-50%);
 z-index:100000;
 background:var(--gold);
 color:#111;
 border-radius:25px;
 padding:9px 16px;
 max-width:90%;
 text-align:center;
}

#lightbox{
 display:none;
 position:fixed;
 inset:0;
 z-index:9000;
 background:#000e;
 align-items:center;
 justify-content:center;
 padding:15px;
}

#lightbox img{
 max-width:95vw;
 max-height:90vh;
 object-fit:contain;
}

#lightbox button{
 position:absolute;
 top:13px;
 left:13px;
}

footer{
 text-align:center;
 padding:32px 12px;
 border-top:1px solid var(--line);
 color:var(--muted);
}

footer strong{
 color:var(--gold);
}

/* INSTALL */

.install-steps{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));
 gap:14px;
}

.install-step{
 padding:17px;
 background:var(--panel);
 border:1px

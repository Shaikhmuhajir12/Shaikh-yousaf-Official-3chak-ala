<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shaikh Yousaf | Official Website</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Cairo,sans-serif;
    background:#050505;
    color:#fff;
    line-height:1.8;
}

a{
    text-decoration:none;
    color:inherit;
}

header{
    position:sticky;
    top:0;
    z-index:999;
    background:rgba(0,0,0,.96);
    border-bottom:1px solid #d4af37;
    backdrop-filter:blur(10px);
}

.navbar{
    max-width:1200px;
    margin:auto;
    padding:12px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    position:relative;
    min-height:65px;
}

.brand{
    color:#d4af37;
    font-size:21px;
    font-weight:800;
}

nav{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

nav a{
    padding:6px 10px;
    border-radius:8px;
    font-size:13px;
}

nav a:hover{
    background:#d4af37;
    color:#000;
}

/* SIDE SOCIAL - HEADER ONLY */
.side-social{
    position:absolute;
    left:12px;
    top:7px;
    display:flex;
    align-items:center;
    gap:7px;
    direction:ltr;
    z-index:10;
}

.side-social a{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#111;
    border:2px solid #d4af37;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 12px rgba(212,175,55,.25);
    transition:.3s;
}

.side-social a:hover{
    transform:translateY(-2px);
    background:#d4af37;
}

.side-social svg{
    width:22px;
    height:22px;
}

.side-logo{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid #d4af37;
    background:#111;
    box-shadow:0 0 12px rgba(212,175,55,.25);
}

.side-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.container{
    width:min(1100px,92%);
    margin:auto;
}

.hero{
    min-height:82vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:50px 15px;
    background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
    url("yousaf-8.jpg") center/cover;
}

.hero-box{
    max-width:850px;
}

.hero h1{
    font-size:clamp(38px,8vw,80px);
    color:#d4af37;
    font-weight:800;
    text-shadow:0 0 25px rgba(212,175,55,.35);
}

.hero h2{
    font-size:clamp(20px,4vw,34px);
    margin:5px 0 15px;
}

.hero p{
    font-size:18px;
    opacity:.9;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:8px 4px;
    padding:11px 20px;
    border:1px solid #d4af37;
    border-radius:30px;
    background:#d4af37;
    color:#000;
    font-weight:700;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px rgba(212,175,55,.45);
}

.btn.dark{
    background:transparent;
    color:#fff;
}

.social-icon{
    width:21px;
    height:21px;
}

section{
    padding:65px 0;
}

.section-title{
    text-align:center;
    color:#d4af37;
    font-size:32px;
    margin-bottom:30px;
}

.card{
    background:linear-gradient(145deg,#111,#080808);
    border:1px solid rgba(212,175,55,.35);
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.card h3{
    color:#d4af37;
    margin-bottom:8px;
}

.about-text{
    text-align:center;
    font-family:"Noto Nastaliq Urdu",serif;
    font-size:20px;
}

.official{
    text-align:center;
}

.official img{
    width:140px;
    height:140px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #d4af37;
    box-shadow:0 0 25px rgba(212,175,55,.3);
}

.video-grid,
.gallery,
.people-grid,
.review-grid,
.games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
}

video{
    width:100%;
    border-radius:15px;
    border:1px solid rgba(212,175,55,.4);
    background:#000;
}

.gallery img{
    width:100%;
    height:280px;
    object-fit:cover;
    border-radius:15px;
    border:1px solid rgba(212,175,55,.3);
}

.person img{
    width:100%;
    height:260px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:10px;
}

.review{
    text-align:center;
}

.stars{
    color:#d4af37;
    font-size:22px;
    margin:5px 0;
}

.sample-note{
    text-align:center;
    color:#aaa;
    font-size:13px;
    margin-top:15px;
}

.game{
    text-align:center;
}

.game input{
    width:100%;
    padding:11px;
    border-radius:10px;
    border:1px solid #555;
    background:#111;
    color:#fff;
    margin:8px 0;
    text-align:center;
}

.game-result{
    min-height:30px;
    color:#d4af37;
    margin-top:8px;
}

.social-box{
    text-align:center;
}

footer{
    padding:30px 15px;
    text-align:center;
    border-top:1px solid rgba(212,175,55,.3);
    color:#aaa;
}

#welcome{
    position:fixed;
    inset:0;
    background:#050505;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    animation:welcomeOut 1s ease 4s forwards;
}

.welcome-box h1{
    color:#d4af37;
    font-size:clamp(35px,8vw,70px);
}

.welcome-box h2{
    font-size:24px;
    margin:8px 0;
}

.welcome-box p{
    color:#aaa;
}

@keyframes welcomeOut{
    to{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }
}

@media(max-width:700px){

    .navbar{
        flex-direction:column;
        padding-top:60px;
    }

    nav{
        justify-content:center;
    }

    .side-social{
        left:50%;

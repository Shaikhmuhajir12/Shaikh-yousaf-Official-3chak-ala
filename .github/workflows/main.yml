
name: Build Shaikh Yousaf APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create Android application
        shell: bash
        run: |
          set -e

          test -f index.html || { echo "index.html missing"; exit 1; }
          test -f YqR4K.jpg || { echo "YqR4K.jpg missing from repository root"; exit 1; }

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/shaikhyousaf/app

          cp index.html app/src/main/assets/index.html

          find . -maxdepth 1 -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \
            -o -iname "*.webp" -o -iname "*.gif" -o -iname "*.css" \
            -o -iname "*.js" -o -iname "*.svg" -o -iname "*.mp4" \) \
            ! -name "YqR4K.jpg" \
            -exec cp {} app/src/main/assets/ \;

          for item in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${item%%:*}"
            size="${item##*:}"
            mkdir -p "app/src/main/res/mipmap-${density}"
            convert YqR4K.jpg -background white -alpha remove \
              -gravity center -resize "${size}x${size}^" \
              -extent "${size}x${size}" \
              "app/src/main/res/mipmap-${density}/ic_launcher.png"
          done

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ShaikhYousaf"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.shaikhyousaf.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.shaikhyousaf.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="Shaikh Yousaf"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8B4513</item>
                  <item name="android:statusBarColor">#24150F</item>
                  <item name="android:navigationBarColor">#24150F</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/shaikhyousaf/app/MainActivity.java <<'EOF'
          package com.shaikhyousaf.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shaikh-Yousaf-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
